name: build-arcvm-kernelsu

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: KernelSU tag (empty = latest release)
        required: false
        default: ""
      kernel_version:
        description: ARCVM kernel release / commit (empty = branch tip)
        required: false
        default: ""
      kernel_branch:
        description: ChromeOS kernel branch
        required: true
        default: chromeos-5.10-arcvm
      arch:
        description: Architecture
        required: true
        type: choice
        options: [both, x86_64, arm64]
        default: both
  schedule:
    # 每天跟踪 KernelSU release；内核跟随分支 tip。
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (inputs.arch == 'x86_64' || inputs.arch == 'arm64') && fromJSON(format('["{0}"]', inputs.arch)) || fromJSON('["x86_64","arm64"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: cfg
        env:
          IN_KSU: ${{ inputs.ksu_tag }}
          REL: ${{ inputs.kernel_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ksu="$IN_KSU"
          if [ -z "$ksu" ]; then
            ksu=$(curl -fsSL https://api.github.com/repos/tiann/KernelSU/releases/latest \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          fi
          echo "ksu=$ksu" >> "$GITHUB_OUTPUT"
          case "$ARCH" in
            x86_64)  echo "defconfig=x86_64_arcvm_defconfig" >> "$GITHUB_OUTPUT" ;;
            arm64)   echo "defconfig=arm64_arcvm_defconfig"  >> "$GITHUB_OUTPUT" ;;
            *) echo "bad arch"; exit 1 ;;
          esac
          # kernel_version 可以写成 5.10.252-1009564-ged76cab4c76e，也可以只给 commit 前缀
          commit=$(printf '%s' "$REL" | sed -n 's/.*-g\([0-9a-f]\{7,\}\).*/\1/p')
          if [ -z "$commit" ] && printf '%s' "$REL" | grep -Eq '^[0-9a-f]{7,40}$'; then
            commit="$REL"
          fi
          if [ -z "$commit" ] && [ -z "$REL" ]; then
            commit=$(git ls-remote "https://chromium.googlesource.com/chromiumos/third_party/kernel.git" \
              "refs/heads/${{ inputs.kernel_branch }}" | cut -f1)
            echo "::notice::kernel_version empty, using ${{ inputs.kernel_branch }} tip $commit"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "KernelSU=$ksu kernel=${REL:-branch-tip} arch=$ARCH commit=${commit:-?}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flex bison bc python3 curl tar gzip git rsync \
            make gcc libssl-dev libelf-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            lsb-release wget software-properties-common ca-certificates
          # stock ARCVM 内核用的是 Chromium OS clang 22.0.0git / LLD 22.0.0
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 22
          for t in clang clang++ llvm-ar llvm-strip llvm-nm llvm-objcopy llvm-objdump llvm-readelf ld.lld; do
            sudo ln -sf "/usr/bin/${t}-22" "/usr/local/bin/${t}"
          done
          clang --version | head -1
          ld.lld --version | head -1

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl || true

      - name: Fetch kernel source
        id: src
        env:
          BRANCH: ${{ inputs.kernel_branch }}
          COMMIT: ${{ steps.cfg.outputs.commit }}
          REL: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          BASE=https://chromium.googlesource.com/chromiumos/third_party/kernel
          if [ -n "$COMMIT" ]; then
            sha=$(curl -fsSL "$BASE/+log/$COMMIT?format=JSON&n=1" | tail -c +5 \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["log"][0]["commit"])')
          else
            sha=$(git ls-remote "$BASE.git" "refs/heads/$BRANCH" | cut -f1)
          fi
          echo "kernel commit: $sha"
          curl -fsSL --retry 3 -o kernel.tar.gz "$BASE/+archive/$sha.tar.gz"
          mkdir -p kernel-src
          tar -xzf kernel.tar.gz -C kernel-src
          if [ -z "$REL" ]; then
            REL=$(awk '/^VERSION =/{v=$3}/^PATCHLEVEL =/{p=$3}/^SUBLEVEL =/{s=$3}END{print v"."p"."s}' kernel-src/Makefile)
            echo "::notice::kernel_version not given, using $BRANCH tip release $REL"
          elif ! printf '%s' "$REL" | grep -Eq '^[0-9]+\.[0-9]+'; then
            # 只给了 commit：用源码版本 + -g<sha> 组成 release
            srcver=$(awk '/^VERSION =/{v=$3}/^PATCHLEVEL =/{p=$3}/^SUBLEVEL =/{s=$3}END{print v"."p"."s}' kernel-src/Makefile)
            REL="$srcver-g$(printf '%s' "$sha" | cut -c1-12)"
            echo "::notice::kernel_version is a commit, using release $REL"
          fi
          kmi=$(printf '%s' "$REL" | sed 's/-.*//' | cut -d. -f1,2)
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
          echo "kmi=$kmi" >> "$GITHUB_OUTPUT"
          echo "kernel release: $REL (KMI $kmi)"

      - name: Skip if release already exists (schedule only)
        id: exists
        env:
          TAG: build-${{ steps.cfg.outputs.ksu }}-${{ steps.src.outputs.rel }}-${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate kernel config
        if: steps.exists.outputs.skip != 'true'
        env:
          ARCH: ${{ matrix.arch }}
          DEFCONFIG: ${{ steps.cfg.outputs.defconfig }}
        run: |
          set -euo pipefail
          FRAGMENT="$PWD/kernel/arcvm-fragment.config"
          cd kernel-src
          make LLVM=1 ARCH="$ARCH" "$DEFCONFIG"
          while read -r opt; do
            case "$opt" in CONFIG_*=y|CONFIG_*=m) ./scripts/config --file .config -e "${opt%%=*}" ;; esac
          done < "$FRAGMENT"
          make LLVM=1 ARCH="$ARCH" olddefconfig
          cp .config "$RUNNER_TEMP/kernel.config"
          grep -E '^CONFIG_SERIAL_8250_CONSOLE|^CONFIG_LOCALVERSION' "$RUNNER_TEMP/kernel.config"

      - name: Build vmlinux (source-only, LKM)
        if: steps.exists.outputs.skip != 'true'
        env:
          KSU_TAG: ${{ steps.cfg.outputs.ksu }}
          ARCH: ${{ matrix.arch }}
          REL: ${{ steps.src.outputs.rel }}
          KSU_MODE: lkm
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          chmod +x scripts/*.sh
          ./scripts/build-arcvm-kernelsu-vmlinux.sh \
            --kernel-version "$REL" \
            --config "$RUNNER_TEMP/kernel.config" \
            --kernel-src "$PWD/kernel-src" \
            --ksu-tag "$KSU_TAG" \
            --arch "$ARCH" \
            --work "$RUNNER_TEMP/build" \
            --out "$PWD/dist"

      - name: Checksums
        if: steps.exists.outputs.skip != 'true'
        env:
          KMI: ${{ steps.src.outputs.kmi }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # 资产按 KMI 命名：一台 5.10 设备只关心 5.10 的产物
          for f in dist/vmlinux-*; do
            case "$f" in
              *-"$ARCH") mv -f "$f" "dist/vmlinux-$KMI-$ARCH" ;;
              *) rm -f "$f" ;;
            esac
          done
          cp host/bootscripts/*.sh dist/
          cd dist && md5sum vmlinux-* *.sh > checksums.md5 && cat checksums.md5

      - name: Publish rolling release
        # 定时任务只产出不可变 build-*，latest-* 只由人工 dispatch 提升，避免每天把未验证的 tip 推给用户
        if: steps.exists.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ steps.src.outputs.kmi }}-${{ matrix.arch }}
          name: ARCVM KernelSU / ${{ steps.src.outputs.kmi }} / ${{ matrix.arch }}
          files: dist/*
          make_latest: false
          body: |
            ARCVM `${{ steps.src.outputs.kmi }}` / `${{ matrix.arch }}`，内核 `${{ steps.src.outputs.rel }}`，KernelSU `${{ steps.cfg.outputs.ksu }}`（LKM）。

            ```sh
            curl -fsSL https://stevezmt.top/arcvm-kernelsu/install.sh | sudo bash -s -- -y
            ```

      - name: Publish versioned release
        if: steps.exists.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.cfg.outputs.ksu }}-${{ steps.src.outputs.rel }}-${{ matrix.arch }}
          name: KernelSU ${{ steps.cfg.outputs.ksu }} / ${{ steps.src.outputs.rel }} / ${{ matrix.arch }}
          files: dist/*
          make_latest: false
